name: Setup Ruby
description: Set up Ruby with bundler cache using a single pinned ruby/setup-ruby reference

runs:
  using: composite
  steps:
    - name: Setup Ruby and install gems
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        bundler-cache: true
