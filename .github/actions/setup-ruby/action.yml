name: Setup Ruby
description: Set up Ruby with bundler cache using a single pinned ruby/setup-ruby reference

runs:
  using: composite
  steps:
    - name: Setup Ruby and install gems
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        bundler-cache: true
