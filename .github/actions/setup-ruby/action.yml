name: Setup Ruby
description: Set up Ruby with bundler cache using a single pinned ruby/setup-ruby reference

runs:
  using: composite
  steps:
    - name: Setup Ruby and install gems
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        bundler-cache: true
