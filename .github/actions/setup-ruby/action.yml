name: Setup Ruby
description: Set up Ruby with bundler cache using a single pinned ruby/setup-ruby reference

runs:
  using: composite
  steps:
    - name: Setup Ruby and install gems
      uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
      with:
        bundler-cache: true
